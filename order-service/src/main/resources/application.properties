spring.application.name=order-service
server.port=8081

# --- Base de datos ---
spring.datasource.url=jdbc:postgresql://localhost:5432/order-database
spring.datasource.username=postgres
spring.datasource.password=1234

# --- JPA: Flyway manda sobre el esquema, Hibernate solo valida ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Kafka
spring.kafka.bootstrap-servers=localhost:9092

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics


# --- URLs de los servicios ---
services.payment.url=http://localhost:8082
services.inventory.url=http://localhost:8083
services.shipping.url=http://localhost:8084

# Producer (comandos y eventos de la saga)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties[spring.json.add.type.headers]=false
spring.kafka.producer.properties[max.block.ms]=5000

# Consumer (respuestas de Shipping)
spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties[spring.deserializer.value.delegate.class]=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties[spring.json.value.default.type]=com.alessandro.order_service.messaging.ShippingReply
spring.kafka.consumer.properties[spring.json.use.type.headers]=false
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.alessandro.order_service.messaging